services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    command: >
      sh -c "
      while ! nc -z db 3306; do sleep 1; done;
      alembic upgrade head &&
      uvicorn main:app --host 0.0.0.0 --port 8000
      "

  celery:
    build: ./backend
    command: celery -A celery_app worker --beat --loglevel=info
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
      - api

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: your_db_name
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  task-dispatch-pro:
    build: ./task-dispatch-pro
    ports:
      - "6057:6057"
    depends_on:
      - api

  worker-insight-hub:
    build: ./worker-insight-hub
    ports:
      - "5679:5679"
    depends_on:
      - api

volumes:
  mysql_data: